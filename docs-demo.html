<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Puff Background · README 演示录制</title>
    <style>
      /* 仿 ChatGPT 桌面端界面；画布 z-index 0，内容层始终在其上方 */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root { font-family: "Segoe UI", system-ui, sans-serif; }
      body { background: #000; }
      #shot { position: absolute; left: 0; top: 0; width: 680px; height: 420px; display: grid; grid-template-columns: 168px minmax(0, 1fr); }
      .side { padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
      .side .brand { font-size: 14px; font-weight: 600; padding: 6px 8px 10px; }
      .side .item { padding: 8px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
      .side .item span.arrow { opacity: 0.5; }
      .pane { position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; }
      .pane > :not(#bg) { position: relative; }
      #bg { position: absolute; left: 0; top: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; background: transparent; }
      #shot[data-anim="cat"] #bg, #shot[data-anim="capybara"] #bg { height: calc(100% - 96px); }
      .topbar { height: 44px; flex: none; display: flex; align-items: center; padding: 0 16px; font-size: 13px; font-weight: 600; }
      .chat { flex: 1; padding: 18px 20px; display: flex; flex-direction: column; gap: 18px; font-size: 13px; }
      .ask { align-self: flex-end; padding: 8px 14px; border-radius: 16px; font-size: 13px; line-height: 1.5; }
      .reply { max-width: 88%; line-height: 1.65; }
      .reply .icons { display: flex; gap: 12px; margin-top: 8px; font-size: 12px; opacity: 0.45; }
      .composer { flex: none; margin: 0 16px 6px; min-height: 64px; border-radius: 22px; display: flex; align-items: flex-start; padding: 14px 16px; gap: 10px; font-size: 13px; }
      .composer .plus { font-size: 16px; line-height: 1; margin-top: 1px; }
      .composer .up { margin-left: auto; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; }
      .note { flex: none; text-align: center; font-size: 11px; padding: 6px 0 10px; }

      /* 深色主题（参考 ChatGPT 深色模式截图） */
      #shot[data-theme="dark"] { background: #0d0d0d; color: #ececec; }
      #shot[data-theme="dark"] .side { background: #171717; color: #d4d4d4; }
      #shot[data-theme="dark"] .side .item:hover { background: #242424; }
      #shot[data-theme="dark"] .pane { background: #0d0d0d; }
      #shot[data-theme="dark"] .ask { background: #2f2f2f; color: #ececec; }
      #shot[data-theme="dark"] .reply { color: #ececec; }
      #shot[data-theme="dark"] .composer { background: #2f2f2f; color: #9a9a9a; }
      #shot[data-theme="dark"] .composer .up { background: #4a4a4a; color: #d4d4d4; }
      #shot[data-theme="dark"] .note { color: #7a7a7a; }

      /* 浅色主题（参考 ChatGPT 浅色模式截图） */
      #shot[data-theme="light"] { background: #ffffff; color: #0d0d0d; }
      #shot[data-theme="light"] .side { background: #f9f9f9; color: #3a3a3a; border-right: 1px solid #efefef; }
      #shot[data-theme="light"] .pane { background: #ffffff; }
      #shot[data-theme="light"] .ask { background: #f4f4f4; color: #0d0d0d; }
      #shot[data-theme="light"] .reply { color: #0d0d0d; }
      #shot[data-theme="light"] .composer { background: #ffffff; border: 1px solid #e5e5e5; color: #8e8e8e; box-shadow: 0 2px 10px #0000000a; }
      #shot[data-theme="light"] .composer .up { background: #0d0d0d; color: #ffffff; }
      #shot[data-theme="light"] .note { color: #9a9a9a; }
    </style>
  </head>
  <body>
    <div id="shot" data-theme="dark" data-anim="shark">
      <div class="side">
        <div class="brand">ChatGPT</div>
        <div class="item">新聊天</div>
        <div class="item">项目 <span class="arrow">›</span></div>
        <div class="item">最近 <span class="arrow">›</span></div>
      </div>
      <section class="pane">
        <canvas id="bg" aria-hidden="true"></canvas>
        <div class="topbar">问候交流</div>
        <div class="chat">
          <div class="ask">你好</div>
          <div class="reply">
            晚上好呀！今天想聊点什么？工作、AI创作，还是单纯来找我唠唠嗑？
            <div class="icons"><span>⧉</span><span>♪</span><span>↻</span><span>···</span></div>
          </div>
        </div>
        <div class="composer"><span class="plus">＋</span><span>询问 ChatGPT</span><span class="up">↑</span></div>
        <div class="note">ChatGPT 可能会出错。请核查重要信息。</div>
      </section>
    </div>
    <script type="module" src="/src/docs-demo.ts"></script>
  </body>
</html>
