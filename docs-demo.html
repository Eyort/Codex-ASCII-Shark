<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Puff Background · README 演示录制</title>
    <style>
      /* 与设置页 src/style.css 相同的界面语言：画布 z-index 0，内容层在其上方 */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root { font-family: "Segoe UI", system-ui, sans-serif; color: #536773; }
      body { background: #fbf7eb; }
      #shot {
        position: absolute; left: 0; top: 0; width: 720px; height: 440px;
        display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px;
        padding: 12px; background: #fbf7eb; font-size: 13px;
      }
      aside { padding: 18px 12px; border-radius: 18px; background: #f5f0e3; font-size: 12px; }
      .nav { margin-top: 20px; padding: 9px 8px; color: #929b9e; border-radius: 8px; }
      .nav.active { background: #ebe8dc; color: #60717a; }
      .work { position: relative; isolation: isolate; overflow: hidden; border-radius: 20px; background: #f7f3e7; display: flex; flex-direction: column; }
      .work > :not(#bg) { position: relative; }
      #bg { position: absolute; left: 0; top: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; background: transparent; }
      #shot[data-anim="hands"] #bg { left: 18px; width: calc(100% - 36px); height: calc(100% - 112px); }
      #shot[data-anim="cat"] #bg, #shot[data-anim="capybara"] #bg { height: calc(100% - 112px); }
      .taskhead { height: 56px; padding: 20px 24px; display: flex; justify-content: space-between; border-bottom: 1px solid #eae5d8; font-size: 13px; }
      .muted { color: #98a2a5; font-size: 12px; }
      .conversation { flex: 1; padding: 26px clamp(20px, 6vw, 60px) 20px; display: flex; flex-direction: column; gap: 16px; }
      .bubble { position: relative; max-width: 78%; padding: 13px 16px; border: 1px solid #e7e2d5; border-radius: 16px; background: #fbf8efde; font-size: 13px; line-height: 1.6; box-shadow: 0 5px 20px #3a433d08; }
      .bubble p { margin: 6px 0 0; }
      .bubble.user { align-self: flex-end; background: #eef2f0dc; }
      .composer { position: relative; margin: 0 18px 18px; min-height: 94px; padding: 16px; border: 1px solid #e7e2d7; border-radius: 18px; background: #fbf8efed; box-shadow: 0 3px 14px #443c2708; color: #99a2a3; font-size: 13px; }
      .composer button { position: absolute; bottom: 12px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: #87989d; font-size: 19px; }
      .composer button:first-of-type { left: 12px; }
      .composer .send { right: 12px; border: 1px solid #b8c2c1; font-size: 16px; }
    </style>
  </head>
  <body>
    <div id="shot" data-anim="shark">
      <aside><b>项目</b><div class="nav active">当前任务</div><div class="nav">历史任务</div><div class="nav">设置</div></aside>
      <section class="work">
        <canvas id="bg" aria-hidden="true"></canvas>
        <div class="taskhead"><span>任务内容</span><span class="muted">本地预览</span></div>
        <div class="conversation">
          <div class="bubble user">把选中的 ASCII 动画放进聊天背景。</div>
          <div class="bubble assistant"><b>Codex</b><p>我会先确认对话页面目标区域，然后再开始处理。Canvas 位于内容层后方，不接收鼠标事件。</p></div>
        </div>
        <div class="composer"><span>向 Codex 描述要构建的内容</span><button aria-label="添加">＋</button><button class="send" aria-label="发送">↑</button></div>
      </section>
    </div>
    <script type="module" src="/src/docs-demo.ts"></script>
  </body>
</html>
