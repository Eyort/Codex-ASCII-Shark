<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puff Background · Codex 背景动画设置</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="window">
      <header><span class="mark">≋</span><strong>Puff Background</strong><span class="crumb">/ Codex 背景动画设置</span><span id="saveStatus" class="save-status" role="status" aria-live="polite">正在读取本地设置…</span></header>
      <section class="stage">
        <aside><b>项目</b><div class="nav active">当前任务</div><div class="nav">历史任务</div><div class="nav">设置</div></aside>
        <section class="work">
          <canvas id="ocean" aria-hidden="true"></canvas>
          <canvas id="handsDemo" aria-hidden="true"></canvas>
          <canvas id="sceneDemo" aria-hidden="true"></canvas>
          <div class="taskhead"><span>任务内容</span><span class="muted">本地预览</span></div>
          <div class="conversation">
            <div class="bubble user">把选中的 ASCII 动画放进聊天背景。</div>
            <div class="bubble assistant"><b>Codex</b><p>我会先确认 Work 页面目标区域，然后再开始处理。Canvas 位于内容层后方，不接收鼠标事件。</p></div>
          </div>
          <div class="composer"><span>向 Codex 描述要构建的内容</span><button aria-label="添加">＋</button><button class="send" aria-label="发送">↑</button></div>
        </section>
      </section>
      <footer class="controls" id="controls" data-animation="shark">
        <div class="control-topline">
          <span class="control-title">动画参数</span>
          <span class="control-note">改动会自动保存，并应用到运行中的 Codex</span>
        </div>
        <label class="switch-row"><span>在 Codex 显示动画</span><input id="enabled" type="checkbox" checked /><span class="switch" aria-hidden="true"></span></label>
        <div class="animation-picker" role="group" aria-label="选择聊天背景动画">
          <span>选择动画</span>
          <button type="button" data-choice="shark" aria-pressed="true">鲨鱼</button>
          <button type="button" data-choice="hands" aria-pressed="false">双手</button>
          <button type="button" data-choice="cat" aria-pressed="false">猫</button>
          <button type="button" data-choice="capybara" aria-pressed="false">卡皮巴拉</button>
          <button type="button" data-choice="heart" aria-pressed="false">心脏</button>
        </div>
        <label for="kind" class="shark-controls">鲨鱼种类
          <select id="kind">
            <option value="mixed">混合（8 种）</option>
            <option value="classic">普通鲨</option>
            <option value="hammerhead">锤头鲨</option>
            <option value="greathammer">大锤头鲨</option>
            <option value="zebra">斑马鲨</option>
            <option value="tiger">虎鲨</option>
            <option value="mako">灰鲭鲨</option>
            <option value="thresher">长尾鲨</option>
            <option value="nurse">护士鲨</option>
          </select>
        </label>
        <label class="shark-controls">鲨鱼数量 <input id="count" type="range" min="1" max="12" value="3" /><output>3</output></label>
        <label class="shark-controls">透明度 <input id="opacity" type="range" min="0" max="80" value="32" /><output>32%</output></label>
        <label class="shark-controls">游泳速度 <input id="speed" type="range" min="10" max="200" value="55" /><output>0.55×</output></label>
        <label id="colorRow" class="color-row shark-controls">颜色 <input id="color" type="color" value="#718a99" /><output id="colorValue">#718A99</output></label>
        <label class="hands-controls">双手透明度 <input id="handsOpacity" type="range" min="10" max="80" value="28" /><output id="handsOpacityValue">28%</output></label>
        <label class="hands-controls">呼吸速度 <input id="handsSpeed" type="range" min="50" max="160" value="100" /><output id="handsSpeedValue">1.00×</output></label>
        <label class="hands-controls">整体大小 <input id="handsSize" type="range" min="70" max="120" value="100" /><output id="handsSizeValue">100%</output></label>
        <label class="hands-controls">字符字号 <input id="handsGlyphSize" type="range" min="90" max="140" value="120" /><output id="handsGlyphSizeValue">120%</output></label>
        <label class="hands-controls">双手颜色 <input id="handsColor" type="color" value="#687b72" /><output id="handsColorValue">#687B72</output></label>
        <label class="scene-controls">动画透明度 <input id="sceneOpacity" type="range" min="10" max="90" value="58" /><output id="sceneOpacityValue">58%</output></label>
        <label class="scene-controls">动作速度 <input id="sceneSpeed" type="range" min="50" max="160" value="100" /><output id="sceneSpeedValue">1.00×</output></label>
        <label class="scene-controls">整体大小 <input id="sceneSize" type="range" min="40" max="140" value="100" /><output id="sceneSizeValue">100%</output></label>
        <label class="scene-controls">颜色 <input id="sceneColor" type="color" value="#8ca99a" /><output id="sceneColorValue">#8CA99A</output></label>
        <button id="pause" type="button" aria-pressed="false">暂停动画</button>
        <button id="reset" type="button">恢复默认</button>
      </footer>
      <p id="canvasStatus" class="caption">左侧是实时预览；保存后，Codex 会在约 1 秒内应用新参数。</p>
    </main>
    <script type="module" src="/src/demo.ts"></script>
  </body>
</html>
